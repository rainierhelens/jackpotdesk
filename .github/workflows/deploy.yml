name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # After the 8 p.m. PT drawings, then again in the morning for cashpot / jackpot pages.
  schedule:
    - cron: "30 5 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bake Washington draws and jackpots
        run: npm run bake:wa
        continue-on-error: true
      - name: Bake US jackpot map
        run: npm run bake:map
        continue-on-error: true
      - name: Bake national advertised jackpots
        run: npm run bake:market
        continue-on-error: true
      - name: Push WA feed to Cloudflare Worker
        env:
          WA_FEED_SECRET: ${{ secrets.WA_FEED_SECRET }}
          WA_DRAWS_URL: ${{ secrets.WA_DRAWS_URL }}
        run: |
          if [ -z "$WA_FEED_SECRET" ] || [ -z "$WA_DRAWS_URL" ]; then
            echo "Skipping Worker push (set repo secrets WA_DRAWS_URL and WA_FEED_SECRET)"
            exit 0
          fi
          curl -fsS -X PUT "$WA_DRAWS_URL" \
            -H "Authorization: Bearer $WA_FEED_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @src/data/waDraws.json
        continue-on-error: true
      - name: Push jackpot map to Cloudflare Worker
        env:
          WA_FEED_SECRET: ${{ secrets.WA_FEED_SECRET }}
          WA_DRAWS_URL: ${{ secrets.WA_DRAWS_URL }}
        run: |
          if [ -z "$WA_FEED_SECRET" ] || [ -z "$WA_DRAWS_URL" ]; then
            echo "Skipping map push (set repo secrets WA_DRAWS_URL and WA_FEED_SECRET)"
            exit 0
          fi
          MAP_URL="${WA_DRAWS_URL%/wa-draws}/jackpot-wins"
          curl -fsS -X PUT "$MAP_URL" \
            -H "Authorization: Bearer $WA_FEED_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @src/data/jackpotWins.json
        continue-on-error: true
      - name: Push national jackpots to Cloudflare Worker
        env:
          WA_FEED_SECRET: ${{ secrets.WA_FEED_SECRET }}
          WA_DRAWS_URL: ${{ secrets.WA_DRAWS_URL }}
        run: |
          if [ -z "$WA_FEED_SECRET" ] || [ -z "$WA_DRAWS_URL" ]; then
            echo "Skipping market push (set repo secrets WA_DRAWS_URL and WA_FEED_SECRET)"
            exit 0
          fi
          MARKET_URL="${WA_DRAWS_URL%/wa-draws}/market"
          curl -fsS -X PUT "$MARKET_URL" \
            -H "Authorization: Bearer $WA_FEED_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @src/data/marketQuotes.json
        continue-on-error: true
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
