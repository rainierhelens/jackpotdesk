name: Archive winner counts

# The CA lottery API only serves ~9 months of history, so we append new draws
# to the committed archive daily before they fall out of the window.
on:
  workflow_dispatch:
  schedule:
    - cron: "45 16 * * *" # daily, after the morning results settle

permissions:
  contents: write

concurrency:
  group: popularity
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append new draws to winner-count archive
        run: node scripts/popularity-scrape.mjs
      - name: Refit popularity weights
        run: node scripts/fit-popularity.mjs
        continue-on-error: true
      - name: Commit archive if changed
        run: |
          if git diff --quiet -- src/data/winnerCounts.json src/data/popularity.json; then
            echo "No new draws."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/winnerCounts.json src/data/popularity.json
          git commit -m "data: append winner counts and refit popularity weights"
          git push
