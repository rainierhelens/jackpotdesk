name: Draw-night digest

# Private email for the operator. One recipient, stored only in repo secrets.
# 12:00 UTC is 5:00 a.m. Pacific while PDT. Same clock as the public /recap
# publish in deploy.yml. All 7 days. Same official data libraries.
# Private letter only. Not a public list.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: draw-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and send digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: npm run digest
